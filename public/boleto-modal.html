<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2ª Via - Boleto</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00A8CC;
            --primary-hover: #0090b0;
            --accent: #005F73;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --bg-color: #f1f5f9;
        }

        * { box-sizing: border-box; }

        html {
            background: transparent;
        }

        body {
            margin: 0;
            padding: 24px 16px;
            font-family: 'Outfit', sans-serif;
            background: transparent;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
        }

        .icon {
            width: 52px;
            height: 52px;
            background: #e8f7fb;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--primary);
            flex-shrink: 0;
        }

        .icon svg { width: 26px; height: 26px; }

        h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
        }

        .subtitle {
            margin: 2px 0 0;
            font-size: 13px;
            color: var(--text-muted);
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .info-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px;
        }

        .info-card .label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .info-card .value {
            font-size: 16px;
            font-weight: 600;
            color: #0f172a;
        }

        .info-card .value.due { color: #dc2626; }

        .barcode-box {
            background: #ffffff;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            position: relative;
        }

        .barcode-box .label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .barcode {
            font-family: monospace;
            font-size: 15px;
            font-weight: 600;
            line-height: 1.7;
            word-break: break-all;
            color: #0f172a;
            user-select: all;
            background: #f1f5f9;
            padding: 12px;
            border-radius: 8px;
        }

        .btn {
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 14px 16px;
            width: 100%;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(0, 168, 204, 0.25);
            margin-bottom: 10px;
        }

        .btn:active { transform: translateY(2px); }

        .btn.secondary {
            background: #ffffff;
            color: var(--accent);
            border: 1px solid #cbd5e1;
            box-shadow: none;
        }

        .divider {
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            margin: 14px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        .pix-code {
            background: #f1f5f9;
            border: 1px dashed #cbd5e1;
            border-radius: 12px;
            padding: 14px;
            font-family: monospace;
            font-size: 13px;
            word-break: break-all;
            margin-bottom: 12px;
            color: #334155;
            display: none;
        }

        .toast {
            position: fixed;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 500;
            font-size: 14px;
            transition: bottom 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .toast.show { bottom: 20px; }

        @media print {
            body { background: #fff; padding: 0; }
            .container { box-shadow: none; max-width: 100%; }
            .no-print, .btn, .divider { display: none !important; }
            .barcode { background: none; padding: 0; border: 1px solid #e2e8f0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header no-print">
            <div class="icon">
                <svg fill="currentColor" viewBox="0 0 24 24"><path d="M6 2a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6H6zm6 7a1 1 0 011 1v3.27l2.46 1.47a1 1 0 01-1 1.74l-2.96-1.77A1 1 0 0110 14V10a1 1 0 011-1z"/></svg>
            </div>
            <div>
                <h1>2ª Via do Boleto</h1>
                <p class="subtitle">Efetue o pagamento no banco, app ou lotérica</p>
            </div>
        </div>

        <div class="info-grid no-print">
            <div class="info-card">
                <div class="label">Fatura</div>
                <div class="value" id="fatura">-</div>
            </div>
            <div class="info-card">
                <div class="label">Vencimento</div>
                <div class="value due" id="vencimento">-</div>
            </div>
            <div class="info-card">
                <div class="label">Valor</div>
                <div class="value" id="valor">-</div>
            </div>
            <div class="info-card">
                <div class="label">Status</div>
                <div class="value" id="status" style="color:#059669;">EM ABERTO</div>
            </div>
        </div>

        <div class="barcode-box">
            <div class="label">Código de Barras</div>
            <div class="barcode" id="barcode">Carregando...</div>
        </div>

        <button class="btn no-print" onclick="copyBarcode()">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
            Copiar Código de Barras
        </button>
        <button class="btn secondary no-print" onclick="window.print()">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4H7v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
            Imprimir / Salvar PDF
        </button>

        <div class="divider no-print">ou pague com PIX</div>

        <div class="pix-code" id="pixCode"></div>
        <button class="btn secondary no-print" onclick="loadPix()">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
            Gerar PIX Copia e Cola
        </button>
    </div>

    <div class="toast" id="toast">Copiado com sucesso!</div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const boleto = urlParams.get('boleto') || '';
        const valor = urlParams.get('valor') || '';
        const venc = urlParams.get('venc') || '';
        const documento = urlParams.get('documento') || '';
        const cpfcnpj = urlParams.get('cpfcnpj') || '';

        document.getElementById('fatura').textContent = documento || '-';
        document.getElementById('vencimento').textContent = venc || '-';
        document.getElementById('valor').textContent = valor ? 'R$ ' + parseFloat(valor).toFixed(2).replace('.', ',') : '-';
        document.getElementById('barcode').textContent = formatBarcode(boleto) || 'Código indisponível';

        function formatBarcode(code) {
            if (!code) return '';
            const digits = code.replace(/\D/g, '');
            if (digits.length !== 47) return digits;
            return digits.slice(0, 5) + '.' + digits.slice(5, 10) + ' ' +
                   digits.slice(10, 15) + '.' + digits.slice(15, 21) + ' ' +
                   digits.slice(21, 26) + '.' + digits.slice(26, 32) + ' ' +
                   digits.slice(32, 33) + ' ' + digits.slice(33, 47);
        }

        function copyBarcode() {
            copyText(boleto);
        }

        function loadPix() {
            const box = document.getElementById('pixCode');
            const btn = event.currentTarget;
            if (box.style.display === 'block') return;
            if (documento && cpfcnpj) {
                fetch('/api/central/pagamento/pix/' + documento, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cpfcnpj })
                }).then(r => r.json()).then(data => {
                    if (data.pix) {
                        box.textContent = data.pix;
                        box.style.display = 'block';
                        btn.innerHTML = 'Copiar Código PIX';
                        btn.onclick = () => copyText(data.pix);
                    } else {
                        toast('PIX indisponível para esta fatura');
                    }
                }).catch(() => toast('Erro ao gerar PIX'));
            } else {
                toast('PIX indisponível para esta fatura');
            }
        }

        function copyText(text) {
            if (!text) { toast('Código indisponível'); return; }
            navigator.clipboard.writeText(text).then(() => showToast()).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast();
            });
        }

        function toast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 3000);
        }

        function showToast() { toast('Copiado com sucesso!'); }
    </script>
</body>
</html>
